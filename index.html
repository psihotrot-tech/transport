<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Živko Pivnički · Transport Srbobran</title>
<meta name="description" content="Šlep služba 0–24 Transport Srbobran. Sačuvajte kontakt jednim dodirom.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#111214;--ink:#F4F1EA;--muted:#C9C5BC;--line:#4A4C50;--panel:#1E2023;--accent:#F2B705}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:44px 20px 28px}
  .kicker{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:4px;color:var(--accent)}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:46px;line-height:.95;margin:6px 0 0}
  .brand span{color:var(--accent)}
  .stripe{height:14px;margin:26px 0 28px;background:repeating-linear-gradient(135deg,var(--accent) 0 18px,var(--bg) 18px 36px);border-radius:3px}
  .name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:36px;margin:0}
  .sub{color:var(--muted);font-size:17px;margin:4px 0 0}
  .actions{display:flex;flex-direction:column;gap:12px;margin-top:28px}
  .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:12px;text-decoration:none;font-weight:600;font-size:18px;border:2px solid var(--ink);color:var(--ink);background:transparent;padding:0 14px;cursor:pointer;font-family:inherit}
  .btn svg{width:22px;height:22px;flex-shrink:0}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#111214;min-height:62px;font-size:20px}
  .btn.ghost{border-color:var(--line)}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .tip{margin-top:auto;padding-top:28px}
  .tip p{margin:0;padding:14px 16px;border-radius:12px;background:var(--panel);font-size:15px;line-height:1.45;color:var(--muted)}
  .tip strong{color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="kicker">ŠLEP SLUŽBA · 0–24</div>
  <h1 class="brand">TRANSPORT <span>SRBOBRAN</span></h1>
  <div class="stripe" aria-hidden="true"></div>

  <p class="name">Živko Pivnički</p>
  <p class="sub">+381 60 655 3500</p>

  <div class="actions">
    <a class="btn primary" href="zivko-pivnicki.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/></svg>
      Sačuvaj kontakt
    </a>
    <div class="row">
      <a class="btn" href="tel:+381606553500">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        Pozovi
      </a>
      <a class="btn" href="https://wa.me/381606553500">WhatsApp</a>
    </div>
    <a class="btn" href="viber://chat?number=%2B381606553500">Viber</a>
    <a class="btn ghost" href="https://www.transportsrbobran.com/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>
      Otvori sajt
    </a>
  </div>

  <div class="tip">
    <p id="tip"><strong>Sačuvajte sajt:</strong> u meniju pregledača izaberite „Dodaj na početni ekran“ ili „Dodaj u obeleživače“.</p>
  </div>
</main>
<script>
  (function(){
    var ua = navigator.userAgent || '';
    var tip = document.getElementById('tip');
    if (/iPhone|iPad|iPod/.test(ua)) {
      tip.innerHTML = '<strong>Sačuvajte sajt:</strong> dodirnite ikonu za deljenje (kvadrat sa strelicom) pa „Dodaj na početni ekran“.';
    } else if (/Android/.test(ua)) {
      tip.innerHTML = '<strong>Sačuvajte sajt:</strong> dodirnite ⋮ u gornjem desnom uglu pa „Dodaj na početni ekran“ ili zvezdicu za obeleživač.';
    }
  })();
</script>
</body>
</html>
